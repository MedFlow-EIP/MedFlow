version: "3.9"

services:
  backend:
    build: ./backend
    container_name: medflow-backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials.json
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data
    restart: always

