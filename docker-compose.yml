services:
  backend:
    build: ./backend
    container_name: medflow-backend
    ports:
      # Joignable seulement depuis la VM : le public passe par Caddy (HTTPS).
      - "127.0.0.1:8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials.json
      # Toujours en production dans Docker : tokens Firebase vérifiés, pas de
      # débogueur Flask, pas d'en-tête X-User-UID accepté (prioritaire sur backend/.env).
      - FLASK_ENV=production
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data
    restart: always

  # HTTPS gratuit (Let's Encrypt) devant le backend. Voir Caddyfile.
  caddy:
    image: caddy:2.8-alpine
    container_name: medflow-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - MEDFLOW_DOMAIN=${MEDFLOW_DOMAIN:-5-196-191-64.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: always

volumes:
  # Certificats Let's Encrypt conservés entre les redémarrages.
  caddy_data:
  caddy_config:
