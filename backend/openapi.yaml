      description: 'Upload a PDF file. The backend extracts text and generates (in parallel):

        - A course title

        - Flashcards (5 Q&A pairs)

        - An HTML summary

        - A quiz (5 multiple-choice questions)


        The generated course is saved and the full course object is returned.

        '
      operationId: processPDF
