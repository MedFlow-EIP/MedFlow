    post:
      summary: Start a revision session
      description: 'Returns a set of flashcards and quiz questions for revision.


        **mode=all** — draws from all user courses (up to 10 flashcards, all quiz questions).

        **mode=course** — draws from a specific course only (up to 10 of each).

        '
      operationId: startRevision
      tags:
