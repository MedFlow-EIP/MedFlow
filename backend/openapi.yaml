      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - mode
              properties:
                mode:
                  type: string
                  enum:
                  - all
                  - course
                  example: course
                course_id:
                  type: string
                  nullable: true
                  description: Required when mode=course
                  example: cardiologie_cours_1
      responses:
        '200':
          description: Revision session data
          content:
            application/json:
              schema:
                type: object
                required:
                - flashcards
                - quiz
                - mode
                properties:
                  flashcards:
                    type: array
                    items:
