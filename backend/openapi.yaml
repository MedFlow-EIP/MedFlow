openapi: 3.0.3
info:
  title: MEDFLOW API
  description: 'REST API for the MEDFLOW medical learning platform.


    ## Authentication


    **Production** — Pass a Firebase ID token as a Bearer token:

    ```

    Authorization: Bearer <firebase_id_token>

    ```


    **Development / Legacy** — Pass the raw Firebase UID in a custom header

    (only available when `FIREBASE_VERIFY=false`):

    ```

    X-User-UID: <firebase_uid>

    ```


    Additional optional headers (used for display purposes only):

    - `X-User-Name` — user display name

    - `X-User-Avatar` — user avatar URL

    '
  version: 2.0.0
  contact:
    name: MEDFLOW Support
servers:
- url: /
  description: Current server
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID Token
      description: Firebase ID token obtained from the client-side Firebase SDK.
    LegacyHeader:
      type: apiKey
      in: header
      name: X-User-UID
      description: 'Raw Firebase UID (dev/legacy mode only — requires `FIREBASE_VERIFY=false` on server).

        '
  schemas:
    Flashcard:
      type: object
      required:
      - question
      - answer
      properties:
        question:
          type: string
          example: Quel est le rôle du ventricule gauche ?
        answer:
          type: string
          example: Pomper le sang oxygéné vers la circulation systémique.
    QuizOption:
      type: object
      description: Map of option letter to option text.
      additionalProperties:
        type: string
      example:
        A: Pompe le sang vers les poumons
        B: Pompe le sang vers le corps
        C: Reçoit le sang des poumons
        D: Filtre le sang
    QuizQuestion:
      type: object
      required:
      - question
      - options
      - correct
      properties:
        question:
          type: string
          example: Quel est le rôle du ventricule gauche ?
        options:
          $ref: '#/components/schemas/QuizOption'
        correct:
          type: string
          example: B
    CourseSummary:
      type: object
      required:
      - id
      - nom
      - sessions
      properties:
        id:
          type: string
          example: cardiologie_cours_1
        nom:
          type: string
          example: Cardiologie - Bases essentielles
        sessions:
          type: integer
          example: 3
    Course:
      type: object
      required:
      - id
      - nom
      - summary
      - flashcards
      - quiz
      - sessions
      properties:
        id:
          type: string
          example: cardiologie_cours_1
        nom:
          type: string
          example: Cardiologie - Bases essentielles
        summary:
          type: string
          description: HTML-formatted course summary.
          example: <h2>Introduction</h2><p>La cardiologie est...</p>
        flashcards:
          type: array
          items:
            $ref: '#/components/schemas/Flashcard'
        quiz:
          type: array
          items:
            $ref: '#/components/schemas/QuizQuestion'
        sessions:
          type: integer
          example: 3
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserProfile:
      type: object
      required:
      - uid
      - displayName
      properties:
        uid:
          type: string
          example: abc123firebaseuid
        displayName:
          type: string
          example: Marie Dupont
        photoURL:
          type: string
          nullable: true
          example: https://example.com/avatar.jpg
    UserStats:
      type: object
      properties:
        cours:
          type: integer
          example: 5
        flashcards:
          type: integer
          example: 25
        sessions:
          type: integer
          example: 12
        detailed_sessions:
          type: object
    Pagination:
      type: object
      required:
      - page
      - per_page
      - total
      - pages
      properties:
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 20
        total:
          type: integer
          example: 47
        pages:
          type: integer
          example: 3
    Path:
      type: object
      required:
      - id
      - title
      - description
      - progress
      - totalLessons
      - completedLessons
      - isLocked
      - color
      - emoji
      properties:
        id:
          type: string
          example: cardiology
        title:
          type: string
          example: Cardiologie
        description:
          type: string
          example: Système cardiovasculaire et pathologies
        progress:
          type: number
          format: float
          example: 40.0
        totalLessons:
          type: integer
          example: 10
        completedLessons:
          type: integer
          example: 4
        isLocked:
          type: boolean
          example: false
        color:
          type: string
          example: '#ef4444'
        emoji:
          type: string
          example: ❤️
    Lesson:
      type: object
      required:
      - id
      - title
      - type
      - status
      - stars
      - position
      - xp
      properties:
        id:
          type: string
          example: '1'
        title:
          type: string
          example: Introduction
        type:
          type: string
          enum:
          - lesson
          - review
          - test
        status:
          type: string
          enum:
          - locked
          - available
          - completed
        stars:
          type: integer
          example: 2
        position:
          type: string
          enum:
          - left
          - center
          - right
        xp:
          type: integer
          example: 10
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          example: UID Firebase requis
security:
- BearerAuth: []
- LegacyHeader: []
tags:
- name: Operations
  description: Health check and operational endpoints
- name: Courses
  description: PDF upload, course retrieval and management
- name: Sessions
  description: Revision sessions and progress tracking
- name: Account
  description: User profile and statistics
- name: Learning Paths
  description: Structured learning paths and lessons
paths:
  /api/account:
    delete:
      tags:
      - Compte, analytique et signalements
      summary: 'Supprime définitivement le compte : Firebase, données en base et fichiers.'
      description: Exige une connexion récente (le mobile redemande le mot de passe ou Google).
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
    get:
      summary: Get user account
      description: Returns the authenticated user's full profile and learning statistics.
      operationId: getAccount
      tags:
      - Account
      responses:
        '200':
          description: User profile and stats
          content:
            application/json:
              schema:
                type: object
                required:
                - user
                - stats
                properties:
                  user:
                    $ref: '#/components/schemas/UserProfile'
                  stats:
                    type: object
                    properties:
                      courses:
                        type: integer
                        example: 5
                      flashcards:
                        type: integer
                        example: 25
                      sessions:
                        type: integer
                        example: 12
                      avg_score:
                        type: number
                        example: 7.4
                      revision_sessions:
                        type: integer
                        example: 4
                      flashcard_sessions:
                        type: integer
                        example: 5
                      quiz_sessions:
                        type: integer
                        example: 3
                      xp:
                        type: integer
                        example: 120
        '400':
          description: Missing authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/account/avatar:
    post:
      tags:
      - Compte, analytique et signalements
      summary: Upload la photo de profil de l'utilisateur, stockée sur le disque
      description: 'du backend (alternative à Firebase Storage, qui exige désormais le

        plan payant Blaze). Écrase l''avatar précédent s''il existe déjà.'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
  /api/account/export:
    get:
      tags:
      - Compte, analytique et signalements
      summary: 'Export RGPD : toutes les données du compte, en JSON.'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
  /api/account/reset-progress:
    post:
      tags:
      - Compte, analytique et signalements
      summary: 'Outil de debug/test : remet à zéro XP, streak, leçons, badges et'
      description: activité de l'utilisateur courant. N'affecte que son propre compte.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
  /api/activity:
    get:
      tags:
      - Compte, analytique et signalements
      summary: Journal d'activité récente de l'utilisateur (leçons complétées,
      description: badges débloqués...).
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
  /api/activity/calendar:
    get:
      tags:
      - Compte, analytique et signalements
      summary: Activité par jour (18 semaines par défaut, 1 an au maximum).
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
  /api/ai/usage:
    get:
      tags:
      - Compte, analytique et signalements
      summary: Ce qu'il reste d'IA aujourd'hui (chat, imports, cas cliniques).
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
  /api/analytics/event:
    post:
      tags:
      - Compte, analytique et signalements
      summary: 'Body: {"event": "import_started", "detail": "pdf"} (detail facultatif).'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
  /api/analytics/screen-view:
    post:
      tags:
      - Compte, analytique et signalements
      summary: Journalise qu'un écran a été vu — signal purement analytique pour
      description: 'repérer les écrans où les utilisateurs arrivent sans jamais agir

        derrière (ex: UploadCourseScreen sans upload, AIChatScreen sans

        message envoyé). Body: {"screen": "UploadCourseScreen"}.'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
  /api/badges:
    get:
      tags:
      - Compte, analytique et signalements
      summary: Catalogue complet des badges, avec l'état débloqué/verrouillé
      description: pour l'utilisateur courant.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
  /api/cases:
    get:
      tags:
      - Cas cliniques
      summary: list cases
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
    post:
      tags:
      - Cas cliniques
      summary: Génère un cas à partir d'un cours (``course_id``) ou d'un sujet (``topic``).
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
  /api/cases/{case_id}:
    delete:
      tags:
      - Cas cliniques
      summary: delete case
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: integer
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
    get:
      tags:
      - Cas cliniques
      summary: get case
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: integer
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
  /api/cases/{case_id}/answer:
    post:
      tags:
      - Cas cliniques
      summary: 'Choix pour l''étape en cours : renvoie le retour sur ce choix, la bonne'
      description: réponse, puis l'étape suivante (ou le débriefing à la fin).
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: integer
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
  /api/challenges:
    get:
      tags:
      - Défis
      summary: Défis envoyés et reçus (30 derniers).
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
    post:
      tags:
      - Défis
      summary: Défie un ami sur ``count`` questions d'un de ses cours.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
  /api/challenges/{challenge_id}:
    get:
      tags:
      - Défis
      summary: Questions du défi (sans les réponses), pour un participant qui n'a pas encore joué.
      parameters:
      - name: challenge_id
        in: path
        required: true
        schema:
          type: integer
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
  /api/challenges/{challenge_id}/decline:
    post:
      tags:
      - Défis
      summary: decline challenge
      parameters:
      - name: challenge_id
        in: path
        required: true
        schema:
          type: integer
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
  /api/challenges/{challenge_id}/submit:
    post:
      tags:
      - Défis
      summary: 'Corrige la copie (``answers`` = {"defi:<index>": "A"}) ; le défi se termine'
      description: quand les deux amis ont joué, et le gagnant reçoit de l'XP.
      parameters:
      - name: challenge_id
        in: path
        required: true
        schema:
          type: integer
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
  /api/course/{course_id}:
    delete:
      summary: Delete a course
      description: Permanently deletes a course belonging to the authenticated user.
      operationId: deleteCourse
      tags:
      - Courses
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
        example: cardiologie_cours_1
      responses:
        '200':
          description: Course deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Missing authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: Get a course
      description: Returns the full content of a single course (summary, flashcards, quiz).
      operationId: getCourse
      tags:
      - Courses
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
        example: cardiologie_cours_1
      responses:
        '200':
          description: Course content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          description: Missing authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
      - Cours et import
      summary: Renomme un cours et/ou remplace ses flashcards (corrections de l'utilisateur).
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
  /api/course/{course_id}/source:
    get:
      tags:
      - Cours et import
      summary: Document d'origine du cours (PDF, Word, PowerPoint ou photo).
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
  /api/courses/demo:
    post:
      tags:
      - Cours et import
      summary: 'Ajoute le cours d''exemple (déjà généré, sans IA) : de quoi réviser'
      description: tout de suite sans importer de PDF. Le rappeler ne le duplique pas.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
  /api/dashboard:
    get:
      summary: Get user dashboard
      description: 'Returns the authenticated user''s courses and statistics.

        Supports optional pagination via `page` and `per_page` query parameters.

        '
      operationId: getDashboard
      tags:
      - Courses
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
          minimum: 1
        description: Page number (1-based)
      - name: per_page
        in: query
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
        description: Number of courses per page
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                type: object
                required:
                - user
                - cours
                - stats
                - pagination
                properties:
                  user:
                    $ref: '#/components/schemas/UserProfile'
                  cours:
                    type: array
                    items:
                      $ref: '#/components/schemas/CourseSummary'
                  stats:
                    $ref: '#/components/schemas/UserStats'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              example:
                user:
                  uid: abc123
                  displayName: Marie Dupont
                  photoURL: null
                cours:
                - id: cardio_1
                  nom: Cardiologie - Bases
                  sessions: 2
                stats:
                  cours: 1
                  flashcards: 5
                  sessions: 2
                pagination:
                  page: 1
                  per_page: 20
                  total: 1
                  pages: 1
        '400':
          description: Missing authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/debug/db-status:
    get:
      tags:
      - Santé
      summary: debug db status
      responses:
        '200':
          description: Succès
  /api/debug/headers:
    get:
      tags:
      - Santé
      summary: debug headers
      responses:
        '200':
          description: Succès
    post:
      tags:
      - Santé
      summary: debug headers
      responses:
        '200':
          description: Succès
  /api/debug/test-with-sample:
    get:
      tags:
      - Santé
      summary: test with sample
      responses:
        '200':
          description: Succès
  /api/exams:
    get:
      tags:
      - Examens
      summary: Examens de l'utilisateur, du plus proche au plus lointain (passés compris).
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
    post:
      tags:
      - Examens
      summary: 'Ajoute un examen : titre, date (AAAA-MM-JJ) et cours à réviser en priorité.'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
  /api/exams/{exam_id}:
    delete:
      tags:
      - Examens
      summary: delete exam
      parameters:
      - name: exam_id
        in: path
        required: true
        schema:
          type: integer
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
  /api/flashcards/due:
    get:
      tags:
      - Flashcards
      summary: Flashcards à revoir aujourd'hui (20 au maximum), d'un cours ou de tous.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
  /api/flashcards/from-text:
    post:
      tags:
      - Cours et import
      summary: Transforme un texte (réponse du chat) en flashcards ajoutées à un cours.
      description: '``course_id`` absent : les cartes vont dans le cours « Notes de l''assistant ».'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
  /api/flashcards/review:
    post:
      tags:
      - Flashcards
      summary: 'Note d''une carte : ``grade`` = again | hard | good | easy.'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
  /api/friends:
    get:
      tags:
      - Amis et classement
      summary: Liste des amis confirmés.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
  /api/friends/leaderboard:
    get:
      tags:
      - Amis et classement
      summary: Classement XP limité à soi + ses amis confirmés.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
  /api/friends/request:
    post:
      tags:
      - Amis et classement
      summary: Envoie une demande d'ami à l'uid fourni dans le body.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
  /api/friends/requests:
    get:
      tags:
      - Amis et classement
      summary: Demandes reçues (à traiter) et envoyées (en attente).
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
  /api/friends/respond:
    post:
      tags:
      - Amis et classement
      summary: 'Accepte ou refuse une demande reçue. Body: {uid, accept: bool}.'
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
  /api/friends/{friend_uid}:
    delete:
      tags:
      - Amis et classement
      summary: Retire un ami (ou annule/refuse une demande liée à cet uid).
      parameters:
      - name: friend_uid
        in: path
        required: true
        schema:
          type: string
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
  /api/leaderboard:
    get:
      tags:
      - Compte, analytique et signalements
      summary: Classement des utilisateurs par XP (top 20 par défaut).
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Succès
        '401':
          description: Token manquant ou invalide
  /api/lessons/{path_id}:
    get:
      summary: Get lessons for a path
      description: Returns all lessons within a learning path for the authenticated user.
      operationId: getLessons
      tags:
      - Learning Paths
      parameters:
      - name: path_id
        in: path
        required: true
        schema:
          type: string
        example: cardiology
      responses:
        '200':
          description: List of lessons
          content:
            application/json:
              schema:
                type: object
                required:
                - lessons
                properties:
                  lessons:
                    type: array
                    items:
