name: medflow
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  # Flutter 3.47 (Dart 3.13) : exigé par ionicons 0.2.3, file_picker, share_plus, record et l'App Store.
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  google_sign_in: ^6.2.2
  http: ^1.6.0
  shared_preferences: ^2.5.3
  provider: ^6.1.5+1
  flutter_svg: ^2.1.0
  flutter_markdown: ^0.7.7+1
  file_picker: ^11.0.3
  image_picker: ^1.1.2
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  printing: ^5.14.3
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  flutter_tts: ^4.2.5
  url_launcher: ^6.3.1
  intl: ">=0.19.0 <0.21.0"
  ionicons: ^0.2.3
  record: ^6.2.1
  flutter_localizations:
    sdk: flutter
  firebase_messaging: ^16.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/anatomy/
