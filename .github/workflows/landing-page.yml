name: Landing page

# Site vitrine (landing-page/) publié sur GitHub Pages :
# https://medflow-eip.github.io/MedFlow/
# Une fois : Settings > Pages > Source : « GitHub Actions ».

on:
  push:
    branches: [main]
    paths:
      - "landing-page/**"
      - ".github/workflows/landing-page.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: landing-page
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing-page/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
