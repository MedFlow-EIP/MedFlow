name: Mirror to Epitech

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  mirror:
    runs-on: ubuntu-latest
    if: github.repository == 'MedFlow-EIP/MedFlow'
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Push mirror to Epitech repo
        env:
          TARGET_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
          TARGET_ORG: ${{ secrets.TARGET_ORG_NAME }}
          TARGET_REPO: ${{ secrets.TARGET_REPO_NAME }}
        run: |
          set -e
          CLEAN_TOKEN="$(printf '%s' "$TARGET_TOKEN" | tr -d '[:space:]')"
          CLEAN_ORG="$(printf '%s' "$TARGET_ORG" | tr -d '[:space:]')"
          CLEAN_REPO="$(printf '%s' "$TARGET_REPO" | tr -d '[:space:]')"

          echo "Longueur token (nettoyé): ${#CLEAN_TOKEN} caractères (brut: ${#TARGET_TOKEN})"
          echo "Org (nettoyée): '${CLEAN_ORG}' (longueur: ${#CLEAN_ORG})"
          echo "Repo (nettoyé): '${CLEAN_REPO}' (longueur: ${#CLEAN_REPO})"

          git remote add mirror "https://x-access-token:${CLEAN_TOKEN}@github.com/${CLEAN_ORG}/${CLEAN_REPO}.git"
          git push mirror --mirror
