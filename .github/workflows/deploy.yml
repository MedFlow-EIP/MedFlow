name: Deploy backend

# Déploie automatiquement le backend sur la VM après chaque push sur main,
# uniquement si la CI est verte. Lance le même ./deploy.sh qu'à la main
# (sauvegarde des .env, pull, rebuild --no-cache, vérification Firebase).
#
# Secrets à créer (Settings > Secrets and variables > Actions) :
#   VM_HOST     IP ou nom DNS de la VM
#   VM_USER     utilisateur SSH (doit pouvoir lancer docker sans sudo)
#   VM_SSH_KEY  clé privée SSH dont la clé publique est dans ~/.ssh/authorized_keys de la VM
#   VM_PORT     (optionnel) port SSH, 22 par défaut

on:
  workflow_run:
    workflows: ["CI MedFlow"]
    types: [completed]
    branches: [main]
  # Bouton « Run workflow » dans l'onglet Actions : permet de mettre une
  # branche de travail sur la VM pour la tester avant de la merger.
  workflow_dispatch:
    inputs:
      branch:
        description: "Branche à déployer sur la VM"
        required: true
        default: main

# Jamais deux déploiements en même temps : le plus récent attend la fin du précédent.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      - name: Déploiement sur la VM via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          command_timeout: 30m
          envs: DEPLOY_BRANCH
          script: |
            set -e
            cd ~/MedFlow
            ./deploy.sh "$DEPLOY_BRANCH"
        env:
          DEPLOY_BRANCH: ${{ github.event.inputs.branch || 'main' }}
