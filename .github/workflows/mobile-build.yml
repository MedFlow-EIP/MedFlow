name: Mobile Build (APK)

on:
  push:
    branches: [ main ]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: "Profil EAS à utiliser"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK on EAS (cloud build)
        run: |
          eas build \
            --platform android \
            --profile "${{ github.event.inputs.profile || 'preview' }}" \
            --non-interactive \
            --wait

      - name: Get latest build artifact URL
        id: build_info
        run: |
          URL=$(eas build:list --platform android --status finished --limit 1 --non-interactive --json | node -e "
            let data = '';
            process.stdin.on('data', d => data += d);
            process.stdin.on('end', () => {
              const builds = JSON.parse(data);
              console.log(builds[0].artifacts.buildUrl);
            });
          ")
          echo "apk_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download APK
        run: curl -L "${{ steps.build_info.outputs.apk_url }}" -o medflow.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: medflow-apk-${{ github.run_number }}
          path: mobile/medflow.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-build-${{ github.run_number }}
          name: "MedFlow mobile build #${{ github.run_number }}"
          files: mobile/medflow.apk
          body: |
            Build automatique généré depuis le commit ${{ github.sha }}.
            Profil EAS : ${{ github.event.inputs.profile || 'preview' }}
            Télécharge le `.apk` ci-dessous et installe-le sur un appareil Android
            (autoriser "sources inconnues" si demandé).
