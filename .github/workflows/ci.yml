name: CI MedFlow

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/workflows/mirror.yml"
      - ".github/workflows/mobile-build.yml"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/workflows/mirror.yml"
      - ".github/workflows/mobile-build.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install -r tests/requirements-test.txt

      - name: Run backend tests (pytest)
        run: |
          cd backend
          pytest --disable-warnings -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      - name: Run frontend tests (jest)
        run: |
          cd frontend
          npm test -- --watchAll=false

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create credentials.json
        run: |
          echo '${{ secrets.GCP_CREDENTIALS_JSON }}' > backend/credentials.json

      - name: Create backend/.env file for Docker
        run: |
          cat > backend/.env << EOF
          GOOGLE_APPLICATION_CREDENTIALS=/app/credentials.json
          EOF

      - name: Create root .env file (interpolation docker-compose.yml)
        run: |
          PRIVATE_KEY_ESCAPED=$(jq -r '.private_key' backend/credentials.json | sed ':a;N;$!ba;s/\n/\\n/g')
          {
            echo "GCP_TYPE=$(jq -r '.type' backend/credentials.json)"
            echo "GCP_PROJECT_ID=$(jq -r '.project_id' backend/credentials.json)"
            echo "GCP_PRIVATE_KEY_ID=$(jq -r '.private_key_id' backend/credentials.json)"
            echo "GCP_PRIVATE_KEY=${PRIVATE_KEY_ESCAPED}"
            echo "GCP_CLIENT_EMAIL=$(jq -r '.client_email' backend/credentials.json)"
            echo "GCP_CLIENT_ID=$(jq -r '.client_id' backend/credentials.json)"
            echo "GCP_AUTH_URI=$(jq -r '.auth_uri' backend/credentials.json)"
            echo "GCP_TOKEN_URI=$(jq -r '.token_uri' backend/credentials.json)"
            echo "GCP_AUTH_PROVIDER_X509_CERT_URL=$(jq -r '.auth_provider_x509_cert_url' backend/credentials.json)"
            echo "GCP_CLIENT_X509_CERT_URL=$(jq -r '.client_x509_cert_url' backend/credentials.json)"
            echo "GCP_UNIVERSE_DOMAIN=$(jq -r '.universe_domain' backend/credentials.json)"
          } > .env

      - name: Build Docker images
        run: |
          docker compose build

      - name: Test Docker startup
        run: |
          docker compose up -d
          sleep 15
          docker ps
          docker compose logs
          docker compose down

      - name: Upload Docker logs on failure
        if: failure()
        run: |
          docker compose logs
